name: Pool Vision Ultra APK
on:
  push:
    branches: [pool-vision-ultra-android-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -al "$ANDROID_HOME/platforms" || true
          ls -al "$ANDROID_HOME/build-tools" || true
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd pool-vision
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PoolVision-build-log
          path: pool-vision/build.log
          if-no-files-found: ignore
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PoolVisionUltraV1-APK
          path: pool-vision/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Report build status to draft PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ -f pool-vision/build.log ]; then
            TAIL="$(tail -n 45 pool-vision/build.log)"
          else
            TAIL="Build failed before Gradle could run."
          fi
          MESSAGE="$(printf 'Pool Vision build result:\n%s' "$TAIL")"
          gh api --method POST "repos/$REPO/issues/$PR_NUM/comments" -f body="$MESSAGE" || true
